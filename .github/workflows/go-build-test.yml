name: Go Build & Test

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label or hosted runner name."
        type: string
        required: false
        default: ubuntu-latest
      go-version:
        description: "Go toolchain version to install."
        type: string
        default: "1.26.5"
      working-directory:
        description: "Directory containing the Go module to build/vet/test."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  go-build-test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -cover
