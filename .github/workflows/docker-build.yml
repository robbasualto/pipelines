name: Docker Build

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label or hosted runner name."
        type: string
        required: false
        default: ubuntu-latest
      image-tag:
        description: "Tag to apply to the locally built image (also exposed as IMAGE_REF)."
        type: string
        required: true
      push:
        description: "Whether to publish the locally validated image to the selected registry."
        type: boolean
        required: false
        default: false
      registry:
        description: "Registry host or address used to qualify image-tag when push is true."
        type: string
        required: false
        default: ""
      context:
        description: "Docker build context."
        type: string
        default: "."
      dockerfile-path:
        description: "Path to the Dockerfile to build."
        type: string
        default: "Dockerfile"
      smoke-test-command:
        description: "Optional shell command to smoke-test the built image. Skipped when empty."
        type: string
        default: ""
      trivy-version:
        description: "Trivy version to install for the report-only vulnerability scan."
        type: string
        default: "v0.70.0"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      IMAGE_REF: ${{ inputs.push && format('{0}/{1}', inputs.registry, inputs.image-tag) || inputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate push configuration
        if: inputs.push
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -eu
          if [ -z "$REGISTRY" ]; then
            echo "::error::push=true requires a non-empty registry input"
            exit 1
          fi
          if [ -z "${NEXUS_DOCKER_PUSH_USERNAME:-}" ]; then
            echo "::error::push=true requires NEXUS_DOCKER_PUSH_USERNAME in the selected runner environment"
            exit 1
          fi
          if [ -z "${NEXUS_DOCKER_PUSH_PASSWORD:-}" ]; then
            echo "::error::push=true requires NEXUS_DOCKER_PUSH_PASSWORD in the selected runner environment"
            exit 1
          fi

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile-path }}
          push: false
          tags: ${{ env.IMAGE_REF }}
          load: true

      - name: Smoke test
        if: inputs.smoke-test-command != ''
        env:
          SMOKE_TEST_COMMAND: ${{ inputs.smoke-test-command }}
        run: bash -c "$SMOKE_TEST_COMMAND"

      - name: Trivy vulnerability scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_REF }}
          version: ${{ inputs.trivy-version }}
          exit-code: "0"

      - name: Login and push image
        if: inputs.push
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -eu
          printf '%s' "$NEXUS_DOCKER_PUSH_PASSWORD" | docker login "$REGISTRY" \
            --username "$NEXUS_DOCKER_PUSH_USERNAME" \
            --password-stdin
          docker push "$IMAGE_REF"
